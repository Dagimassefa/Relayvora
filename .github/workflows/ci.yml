name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Check website JavaScript
        run: |
          node --check apps/site/site.js
          node --check apps/site/serve.mjs
      - name: Prepare public website files
        run: |
          mkdir -p "$RUNNER_TEMP/relayvora-site"
          cp apps/site/index.html apps/site/styles.css apps/site/site.js apps/site/favicon.svg "$RUNNER_TEMP/relayvora-site/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/relayvora-site

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm release:pack
      - run: pnpm release:smoke
      - run: pnpm bench:plan
      - name: CLI smoke test
        shell: bash
        env:
          RELAYVORA_HOME: ${{ runner.temp }}/relayvora-home
        run: |
          node apps/cli/dist/bin.js --version
          node apps/cli/dist/bin.js doctor --json
          node apps/cli/dist/bin.js sessions --all --json

  deploy-website:
    name: Deploy website to GitHub Pages
    needs: [test, website]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
